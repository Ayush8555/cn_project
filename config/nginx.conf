# Mac 2 - Edge reverse proxy + load balancer + TLS termination
# Replace <USER> with the macOS username on Mac 2 (echo $HOME)
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream backends {
        server [2409:40d6:1019:a702:1c7f:850d:6b3b:3039]:3001;  # Mac 3 - Backend A
        server [2409:40d6:1019:a702:1826:abf1:25a2:6be4]:3002;  # Mac 4 - Backend B
    }

    server {
        listen 80;
        listen [::]:80;
        server_name app.team1.test api.team1.test;

        location / {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/<USER>/certs/app.crt;
        ssl_certificate_key /Users/<USER>/certs/app.key;

        location / {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
